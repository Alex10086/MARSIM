# quad_pid — Nav2 速度模式档
#
# 用法（与 single_drone_quad_pid.launch.py 配合）：
#   ros2 launch quad_pid single_drone_quad_pid.launch.py \
#        quad_pid_params:=$(ros2 pkg prefix quad_pid)/share/quad_pid/config/quad_pid_nav.yaml
#
# 与默认档 quad_pid_params.yaml 的区别，以及每条的理由：
quad_pid_node:
  ros__parameters:
    # 只用 /cmd_vel：Nav2 停发（到达/preempt/abort）时不回头去追一个陈旧的
    # RViz 目标。'auto' 档下被锁存的位置目标永不过期，会接管控制权。
    control_mode: "velocity"

    # Jazzy 的 nav2_bringup 把 controller_server 的输出 remap 成 cmd_vel_nav
    # （navigation_launch.py:137），所以默认的 /cmd_vel 收不到东西。
    # ⚠️ 注意：本参数在节点启动时读取一次用于创建订阅者，**不支持运行期热改**
    # （其余参数都支持 ros2 param set 热改）。改它必须重启节点。
    cmd_vel_topic: "/cmd_vel_nav"

    # Nav2 以 20Hz 发布；0.5s 的宽限足以跨过单次丢帧，又能在 Nav2 停止时
    # 迅速冻结设定点（冻结后无人机减速停在参考点上，不会继续前冲）。
    cmd_vel_timeout: 0.5

    # 与 Nav2 参数文件里的 vx_max / vy_max 对齐。
    #
    # 注意区分【指令】与【达到】速度：
    #   twist_max_*      钳的是【指令】
    #   max_horiz_speed  是【达到】速度的硬上限（调速器一旦到达就剔掉沿速度方向的
    #                    加速度分量，所以超调被压到约一个 tick 的量）
    # 两者相等时，达到速度不会超过 Nav2 规划所假设的 vx_max。
    # 代价：斜向指令合成 √2×1.4 ≈ 1.98 会被压到 1.4，斜向吞吐降低。若要完整
    # 斜向吞吐，把 max_horiz_speed 提到 √2×vx_max 并接受约 21% 的瞬时超调。
    twist_max_vx: 0.8
    twist_max_vy: 0.8
    twist_max_wz: 0.6
    twist_max_vz: 1.0
    max_horiz_speed: 0.8

    # max_horiz_dist 在 Twist 模式下同时是【设定点牵引绳(leash)】和 S2 胡萝卜钳位。
    # 这个参数就是【跟踪误差的硬上限】：advance_setpoint() 把设定点钳到距【实际
    # 位置】leash 米内，所以位置环看到的误差永远 <= leash。它同时决定了过弯能切
    # 多深。
    #
    # 实测标定（都在密林里跑长距离目标）：
    #   leash 5.0m -> 切内弯，贴到障碍 0.10m -> ABORT
    #   leash 1.0m -> 仍有 0.38m 中位横向偏差、最大 1.34m，贴到障碍 0.00m -> ABORT
    # 全局计划本身是好的（442 点里 0 点落在障碍上，最小间距 0.98m），所以问题
    # 全在跟踪。0.3m < 0.98m 的计划间距，留出安全裕度。
    # 注意 leash 只限制【修正量】；速度前馈仍然让无人机按指令速度飞，所以缩短
    # leash 不会显著降速。
    max_horiz_dist: 0.4

    # Nav2 做 2D 导航，linear.z 恒为 0；高度由 quad_pid 自己锁存并保持。
    twist_target_height: -1.0
    twist_follow_z: false

    # 位置模式下由 Nav2 流式重发目标；这里保留 false 以维持「目标失效即保持」
    # 的语义（velocity 模式下本参数不参与仲裁，仅影响切回位置模式时）。
    goal_latched: false

    # 排障锚点：在 RViz 里画 /quad_pid/setpoint，可直接看出控制器在追什么，
    # 一眼区分「Nav2 指令错」还是「控制器跟踪错」。发布内容已含 S2 胡萝卜限幅。
    publish_setpoint: true

    verbose: true
