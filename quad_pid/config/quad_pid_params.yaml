quad_pid_node:
  ros__parameters:
    # ── 位置环 (ωn≈0.7~1.0 rad/s) ──
    KP_XY: 0.5
    KD_XY: 1.0
    KP_Z: 1.0
    KD_Z: 1.4
    KI_Z: 0.0

    # ── 姿态环 (I_xx=2.64e-3, ωn≈8 rad/s, ζ≈0.8) ──
    KP_ATT: 0.2
    KD_ATT: 0.04
    KP_YAW: 0.2
    KD_YAW: 0.05

    # ── 物理参数 (必须与 mars_drone_sim 源码一致) ──
    mass: 1.9
    arm_length: 0.22
    k_F: 2.694396e-8
    k_T: 3.508e-10

    # ── 安全限幅 ──
    max_tilt_deg: 20.0
    max_horiz_acc: 3.0
    max_vert_acc_up: 4.0
    max_vert_acc_down: -4.0
    max_torque_xy: 1.0
    max_torque_z: 0.3
    max_rpm: 35000
    min_rpm: 0

    # ── 防炸 ──
    goal_timeout: 1.0
    # RViz 2D Goal Pose publishes once per click; latched keeps tracking it.
    # Set false when driven by a streaming planner (e.g. Nav2).
    goal_latched: true
    # Reject goals whose horizontal distance from the vehicle exceeds this.
    # A near-horizon click in RViz projects kilometres away.
    max_goal_dist: 50.0
    max_horiz_dist: 5.0
    max_horiz_speed: 2.0
    max_descend_speed: 1.0

    # ── 控制频率 ──
    control_rate: 100.0

    # ── 功能开关 ──
    use_imu: true
    verbose: true
    # ── 输入模式（Twist / Nav2）──
    # position: 只用 /cmd；velocity: 只用 /cmd_vel；auto: 取时间戳更新的那个
    # 无 /cmd_vel 发布者时 auto 退化为纯位置模式（与加入 twist 之前一致）
    control_mode: "auto"
    cmd_vel_topic: "/cmd_vel"
    cmd_vel_timeout: 0.5
    twist_max_vx: 1.5
    twist_max_vy: 1.5
    twist_max_wz: 0.8
    twist_max_vz: 1.0
    # >0 → 巡航在此高度；<=0 → 进入速度模式时锁存当前高度
    twist_target_height: -1.0
    # Nav2 的 linear.z 恒为 0，默认不积分（true 只给 3D 规划器用）
    twist_follow_z: false
    publish_setpoint: false
