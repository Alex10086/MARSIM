quad_pid_node:
  ros__parameters:
    # ── 位置环 (ωn≈0.7~1.0 rad/s) ──
    KP_XY: 0.5
    KD_XY: 1.0
    KP_Z: 1.0
    KD_Z: 1.4
    KI_Z: 0.0

    # ── 姿态环 (I_xx=2.64e-3, ωn≈8 rad/s, ζ≈0.8) ──
    KP_ATT: 0.2
    KD_ATT: 0.04
    KP_YAW: 0.2
    KD_YAW: 0.05

    # ── 物理参数 (必须与 mars_drone_sim 源码一致) ──
    mass: 1.9
    arm_length: 0.22
    k_F: 2.694396e-8
    k_T: 3.508e-10

    # ── 安全限幅 ──
    max_tilt_deg: 20.0
    max_horiz_acc: 3.0
    max_vert_acc_up: 4.0
    max_vert_acc_down: -4.0
    max_torque_xy: 1.0
    max_torque_z: 0.3
    max_rpm: 35000
    min_rpm: 0

    # ── 防炸 ──
    goal_timeout: 1.0
    max_horiz_dist: 5.0
    max_horiz_speed: 2.0
    max_descend_speed: 1.0

    # ── 控制频率 ──
    control_rate: 100.0

    # ── 功能开关 ──
    use_imu: true
    verbose: true