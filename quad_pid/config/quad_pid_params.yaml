quad_pid_node:
  ros__parameters:
    # ── 位置环 ──
    KP_XY: 0.8
    KD_XY: 1.5
    KP_Z: 2.5
    KD_Z: 2.0
    KI_Z: 0.0

    # ── 姿态环 ──
    KP_ATT: 4.0
    KD_ATT: 0.8
    KP_YAW: 2.0
    KD_YAW: 0.5

    # ── 物理参数 ──
    mass: 1.9
    arm_length: 0.22
    k_F: 2.6944e-8
    k_T: 1.049e-10

    # ── 安全限幅 ──
    max_tilt_deg: 15.0
    max_horiz_acc: 2.0
    max_vert_acc_up: 4.0
    max_vert_acc_down: -1.0
    max_torque_xy: 5.0
    max_torque_z: 0.5
    max_rpm: 35000
    min_rpm: 0

    # ── 防炸 ──
    goal_timeout: 1.0
    max_horiz_dist: 5.0
    max_horiz_speed: 2.0
    max_descend_speed: 1.0

    # ── 控制频率 ──
    control_rate: 100.0

    # ── 功能开关 ──
    use_imu: true
    verbose: true